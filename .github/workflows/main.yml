name: Build KernelSU OC - NP1
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libssl-dev flex bison

      - name: Fetch Toolchain
        run: |
          mkdir clang
          cd clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/NothingOS-Archive/android_kernel_nothing_sm7325.git -b nothing-os-3.0 kernel

      - name: Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Apply OC Patch
        run: |
          cd kernel
          # เขียนสคริปต์ sed เพื่อเปลี่ยนค่าความถี่ที่นี่ (ตัวอย่างการหาและเปลี่ยนค่า)
           sed -i 's/2515200/2700000/g' arch/arm64/boot/dts/vendor/qcom/sm7325-cpu.dtsi

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make O=out ARCH=arm64 vendor/spacewar_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-OC-NP1
          path: kernel/out/arch/arm64/boot/Image.gz
          
